# Lint, type-check, test and build both halves on every push and pull request.
# derivlab (the option analytics) is installed from the Derivatives Pricing Lab repository, the
# same source the Docker image uses, so type checks and option tests cover it too.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install "derivlab @ https://github.com/enesozs/Derivatives-Pricing-Lab/archive/refs/heads/main.tar.gz#subdirectory=backend"
      - run: pip install -e ".[dev]"
      - run: ruff format --check . ../e2e
      - run: ruff check . ../e2e
      - run: pyright
      - run: pytest -q
        env:
          TESSERA_NO_DISK_CACHE: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build
